[telegram]
# Crea un bot con @BotFather en Telegram -> /newbot -> te da el token.
bot_token = 123456789:AA...tu-token...
# Tu chat id numerico. Habla con tu bot (envia "hola") y luego abre:
#   https://api.telegram.org/bot<TOKEN>/getUpdates
# El numero en "chat":{"id": ...} es tu chat_id.
chat_id = 111111111
# Minutos que el script espera tu respuesta con el captcha antes de rendirse.
captcha_reply_timeout_seconds = 900

[tramite]
# tipo: VISADO o PASAPORTE
tipo = VISADO
# El identificador que figura en el resguardo del tramite / cita previa.
identificador = ESPXXXXXXXXXXXXXXXXXXXXXX
anio_nacimiento = 1990

[schedule]
# El Programador de tareas puede lanzar el script cada 30 min; estos limites
# hacen que solo se haga una consulta real de verdad cada X.
min_interval_minutes = 180
active_hour_start = 8
active_hour_end = 20
