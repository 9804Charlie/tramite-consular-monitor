name: monitor

on:
  # El scheduler de GitHub Actions es poco fiable con intervalos cortos
  # (se salta disparos, el primero tarda mucho). El cron real lo dispara
  # cron-job.org llamando a la API de workflow_dispatch cada 15 min.
  # Ver docs/DEPLOY_ACTIONS.md.
  workflow_dispatch:
    inputs:
      force:
        description: "Forzar consulta ya (ignora horario e intervalo minimo)"
        type: boolean
        default: false

concurrency:
  group: monitor
  # con cadencia de 15 min, si no respondiste el captcha del tick anterior
  # se abandona y llega uno nuevo.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      TZ: America/Havana
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      # opcionales: si no existen, los avisos van al bot del captcha
      NOTIFY_BOT_TOKEN: ${{ secrets.NOTIFY_BOT_TOKEN }}
      NOTIFY_CHAT_ID: ${{ secrets.NOTIFY_CHAT_ID }}
      TRAMITE_TIPO: VISADO
      TRAMITE_ID: ${{ secrets.TRAMITE_ID }}
      ANIO_NAC: ${{ secrets.ANIO_NAC }}
      STATE_GIST_ID: ${{ secrets.STATE_GIST_ID }}
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      # 24/7 cada 15 min: sin horario activo y con intervalo minimo corto.
      MIN_INTERVAL_MINUTES: "12"
      ACTIVE_HOUR_START: "0"
      ACTIVE_HOUR_END: "24"
      CAPTCHA_REPLY_TIMEOUT_SECONDS: "600"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python monitor.py ${{ inputs.force && '--now' || '' }}
