name: monitor

on:
  schedule:
    # cada 30 min dentro de una ventana amplia en UTC; el propio script
    # recorta al horario activo de La Habana (ACTIVE_HOUR_START/END).
    - cron: "*/30 10-23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Forzar consulta ya (ignora horario e intervalo minimo)"
        type: boolean
        default: false

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: America/Havana
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      TRAMITE_TIPO: VISADO
      TRAMITE_ID: ${{ secrets.TRAMITE_ID }}
      ANIO_NAC: ${{ secrets.ANIO_NAC }}
      STATE_GIST_ID: ${{ secrets.STATE_GIST_ID }}
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      MIN_INTERVAL_MINUTES: "180"
      ACTIVE_HOUR_START: "7"
      ACTIVE_HOUR_END: "19"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python monitor.py ${{ inputs.force && '--now' || '' }}
